<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}To-do list{% endblock %}</title>
  <link rel="icon" href="data:,">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
    .errorlist { margin: 0; padding: 0; list-style: none; color: #b00020; }
    .errorlist li { padding: 0; border: 0; }
    button { padding: 0.4rem 0.8rem; font-size: 0.9rem; cursor: pointer; }
    .account { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 0.5rem; color: #555; font-size: 0.9rem; }
    .account form { margin: 0; }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  {# The account bar: on every page, only for a logged-in person. Log out is a POST. #}
  {% if user.is_authenticated %}
    <div class="account">Logged in as <strong>{{ user.username }}</strong><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log out</button></form></div>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
